<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1e1b4b; color: #f8fafc; margin: 0; min-height: 100vh; display: grid; place-items: center; }
  .card { background: #312e81; border-radius: 16px; padding: 2rem; width: min(560px, 92vw); box-shadow: 0 10px 30px #0006; }
  h1 { margin-top: 0; }
  .meta { display: flex; justify-content: space-between; opacity: .8; font-size: .9rem; margin-bottom: 1rem; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: .8rem 1rem; }
  .opt { display: block; width: 100%; margin: .5rem 0; background: #4338ca; color: inherit; text-align: left; }
  .opt:hover:not(:disabled) { background: #5b52e0; }
  .opt.ok { background: #16a34a; }
  .opt.bad { background: #dc2626; }
  .primary { background: #facc15; color: #1e1b4b; font-weight: 700; margin-top: 1rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="start">
    <h1>🧠 Trivia</h1>
    <p>Responde 5 preguntas al azar. ¿Cuántas aciertas?</p>
    <button class="primary" onclick="start()">Empezar</button>
  </div>

  <div id="game" class="hidden">
    <div class="meta"><span id="progress"></span><span id="score"></span></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <button id="next" class="primary hidden" onclick="next()">Siguiente</button>
  </div>

  <div id="end" class="hidden">
    <h1>Resultado</h1>
    <p id="final" style="font-size:1.4rem"></p>
    <button class="primary" onclick="start()">Jugar de nuevo</button>
  </div>
</div>

<script>
let questions = [], idx = 0, score = 0, locked = false;
const $ = id => document.getElementById(id);
const show = id => ["start", "game", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id));

async function start() {
  const res = await fetch("/api/questions?n=5");
  questions = await res.json();
  idx = 0; score = 0;
  show("game");
  render();
}

function render() {
  const q = questions[idx];
  locked = false;
  $("progress").textContent = `Pregunta ${idx + 1} de ${questions.length}`;
  $("score").textContent = `Puntos: ${score}`;
  $("question").textContent = q.q;
  $("next").classList.add("hidden");
  const box = $("options");
  box.replaceChildren();
  q.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = text;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
}

async function answer(choice) {
  if (locked) return;
  locked = true;
  const res = await fetch("/api/answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question_id: questions[idx].id, choice }),
  });
  const { correct, answer: right } = await res.json();
  const btns = $("options").children;
  btns[right].classList.add("ok");
  if (!correct) btns[choice].classList.add("bad");
  if (correct) score++;
  $("score").textContent = `Puntos: ${score}`;
  $("next").textContent = idx === questions.length - 1 ? "Ver resultado" : "Siguiente";
  $("next").classList.remove("hidden");
}

function next() {
  idx++;
  if (idx >= questions.length) {
    $("final").textContent = `Acertaste ${score} de ${questions.length} 🎉`;
    show("end");
  } else {
    render();
  }
}
</script>
</body>
</html>
